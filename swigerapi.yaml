        and a foreign id 404s instead of leaking existence.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this store address.
        required: true
      tags:
      - stores-addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedStoreAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedStoreAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedStoreAddressRequest'
      security:
      - StoreAdminBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAddress'
          description: ''
    delete:
      operationId: stores_addresses_destroy
      description: |-
        CRUD scoped to the authenticated store admin's own store. `store` is never
        read from the request body/URL - only from the JWT-resolved account - so
        one store's admin can never read, edit, or delete another store's rows,
        and a foreign id 404s instead of leaking existence.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
