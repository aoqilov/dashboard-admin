        required: true
      tags:
      - stores-addresses
      security:
      - StoreAdminBearerAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/stores/addresses/get-all/:
    post:
      operationId: stores_addresses_get_all_create
      description: |-
        CRUD scoped to the authenticated store admin's own store. `store` is never
