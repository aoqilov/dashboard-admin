      summary: List (filterable)
      tags:
      - stores-addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
            examples:
              Example:
                value:
                  page: 1
                  pageSize: 20
                  filters:
                    name: Главный офис
                    address: ул. Ленина, 1
                    landmark: рядом с ТЦ Атриум
                    working_hours: 09:00-21:00
                    phone: '+79990001122'
                    created_at:
                      eq: '2026-09-21'
                      gt: '2026-01-01'
                      gte: '2026-01-01'
                      lt: '2026-12-31'
                      lte: '2026-12-31'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
      security:
      - StoreAdminBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoreAddress'
          description: ''
