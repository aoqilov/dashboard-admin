openapi: 3.0.3
info:
  title: Birid API
  version: 1.0.0
  description: Clothing marketplace backend - buyers and store admins.
paths:
  /api/v1/customers/favorites/products/{product_id}:
    post:
      operationId: customers_favorites_products_create
      summary: Add product to favorites
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - customers-favorites
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          description: Added to favorites.
    delete:
      operationId: customers_favorites_products_destroy
      summary: Remove product from favorites
      parameters:
      - in: path
        name: product_id
        schema:
          type: integer
        required: true
      tags:
      - customers-favorites
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          description: Removed from favorites.
  /api/v1/customers/favorites/products/get-all:
    post:
      operationId: customers_favorites_products_get_all_create
      description: Buyer's favorited products, paginated - no field filtering (see
        products' .../get-all for that pattern).
      summary: List favorite products (paginated)
      tags:
      - customers-favorites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PageRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PageRequestRequest'
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFavoriteProduct'
          description: ''
  /api/v1/customers/favorites/stores/{store_id}:
    post:
      operationId: customers_favorites_stores_create
      summary: Add store to favorites
      parameters:
      - in: path
        name: store_id
        schema:
          type: integer
        required: true
      tags:
      - customers-favorites
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          description: Added to favorites.
    delete:
      operationId: customers_favorites_stores_destroy
      summary: Remove store from favorites
      parameters:
      - in: path
        name: store_id
        schema:
          type: integer
        required: true
      tags:
      - customers-favorites
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          description: Removed from favorites.
  /api/v1/customers/favorites/stores/get-all:
    post:
      operationId: customers_favorites_stores_get_all_create
      description: Buyer's favorited stores, paginated - no field filtering (see products'
        .../get-all for that pattern).
      summary: List favorite stores (paginated)
      tags:
      - customers-favorites
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PageRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PageRequestRequest'
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStore'
          description: ''
  /api/v1/customers/login:
    post:
      operationId: customers_login_create
      summary: Buyer login
      tags:
      - customers-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
          description: ''
  /api/v1/customers/me:
    get:
      operationId: customers_me_retrieve
      description: Current buyer's own profile - read and edit it (name/age/gender/city/avatar).
      summary: Current buyer
      tags:
      - customers-auth
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerMe'
          description: ''
    patch:
      operationId: customers_me_partial_update
      description: Current buyer's own profile - read and edit it (name/age/gender/city/avatar).
      summary: Update current buyer
      tags:
      - customers-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBuyerUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBuyerUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBuyerUpdateRequest'
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuyerMe'
          description: ''
  /api/v1/customers/orders/:
    post:
      operationId: customers_orders_create
      description: |-
        Buyer side: checkout (create), browse own order history, and cancel an
        order while it's still pending_confirmation. Any other status change is
        store-admin only (see orders/viewsets.py).
      tags:
      - customers-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerOrderCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomerOrderCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomerOrderCreateRequest'
        required: true
      security:
      - BuyerBearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrder'
          description: ''
  /api/v1/customers/orders/{id}/:
    get:
      operationId: customers_orders_retrieve
      description: |-
        Buyer side: checkout (create), browse own order history, and cancel an
        order while it's still pending_confirmation. Any other status change is
        store-admin only (see orders/viewsets.py).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this store order.
        required: true
      tags:
      - customers-orders
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrder'
          description: ''
    patch:
      operationId: customers_orders_partial_update
      description: |-
        Buyer side: checkout (create), browse own order history, and cancel an
        order while it's still pending_confirmation. Any other status change is
        store-admin only (see orders/viewsets.py).
      summary: Cancel order (buyer, pending_confirmation only)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this store order.
        required: true
      tags:
      - customers-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCustomerOrderCancelRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCustomerOrderCancelRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCustomerOrderCancelRequest'
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreOrder'
          description: ''
  /api/v1/customers/orders/get-all/:
    post:
      operationId: customers_orders_get_all_create
      description: |-
        Buyer side: checkout (create), browse own order history, and cancel an
        order while it's still pending_confirmation. Any other status change is
        store-admin only (see orders/viewsets.py).
      summary: List (filterable)
      tags:
      - customers-orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
            examples:
              Example:
                value:
                  page: 1
                  pageSize: 20
                  filters:
                    status: pending_confirmation
                    created_at:
                      eq: '2026-09-21'
                      gt: '2026-01-01'
                      gte: '2026-01-01'
                      lt: '2026-12-31'
                      lte: '2026-12-31'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
      security:
      - BuyerBearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStoreOrder'
          description: ''
  /api/v1/customers/refresh:
    post:
      operationId: customers_refresh_create
      summary: Buyer token refresh
      tags:
      - customers-auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RefreshRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPairResponse'
          description: ''
  /api/v1/public/news/{id}/:
    get:
      operationId: public_news_retrieve
      description: |-
        Unauthenticated marketplace browsing - only news that is currently
        "live": status=active (excludes draft/archived), the current moment
        falls inside [starts_at, ends_at], and the owning store is active.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this store news.
        required: true
      tags:
      - public-news
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStoreNews'
          description: ''
  /api/v1/public/news/get-all/:
    post:
      operationId: public_news_get_all_create
      description: |-
        Unauthenticated marketplace browsing - only news that is currently
        "live": status=active (excludes draft/archived), the current moment
        falls inside [starts_at, ends_at], and the owning store is active.
      summary: List (filterable)
      tags:
      - public-news
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
            examples:
              Example:
                value:
                  page: 1
                  pageSize: 20
                  filters:
                    store: 1
                    title: Скидки к сезону
                    news_type: discount
                    created_at:
                      eq: '2026-09-21'
                      gt: '2026-01-01'
                      gte: '2026-01-01'
                      lt: '2026-12-31'
                      lte: '2026-12-31'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicStoreNews'
          description: ''
  /api/v1/public/products/{id}/:
    get:
      operationId: public_products_retrieve
      description: |-
        Unauthenticated marketplace browsing - only products belonging to an
        active store are visible. BuyerJWTAuthentication is attached (with
        AllowAny) so a buyer token is recognized when present but never
        required - anonymous browsing still works, it's just the view-count
        increment on retrieve that needs to know who's asking.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this store product.
        required: true
      tags:
      - public-products
      security:
      - BuyerBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProduct'
          description: ''
  /api/v1/public/products/get-all/:
    post:
      operationId: public_products_get_all_create
      description: |-
        Unauthenticated marketplace browsing - only products belonging to an
        active store are visible. BuyerJWTAuthentication is attached (with
        AllowAny) so a buyer token is recognized when present but never
        required - anonymous browsing still works, it's just the view-count
        increment on retrieve that needs to know who's asking.
      summary: List (filterable)
      tags:
      - public-products
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
            examples:
              Example:
                value:
                  page: 1
                  pageSize: 20
                  filters:
                    store: 1
                    name: Платье
                    category: 1
                    subcategory: 2
                    brand: Zara
                    manufacture: Италия
                    materials:
                    - 1
                    - 2
                    tags:
                    - 1
                    - 2
                    color: 3
                    size:
                      gte: 40
                      lte: 46
                    price_sale:
                      gte: '1000.00'
                      lte: '20000.00'
                    price_rental:
                      gte: '0.00'
                    price_tailoring:
                      gte: '0.00'
                    is_sellable: true
                    is_rentable: false
                    blur_image_in_site: false
                    created_at:
                      eq: '2026-09-21'
                      gt: '2026-01-01'
                      gte: '2026-01-01'
                      lt: '2026-12-31'
                      lte: '2026-12-31'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
      security:
      - BuyerBearerAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicProduct'
          description: ''
  /api/v1/public/stores/{id}/:
    get:
      operationId: public_stores_retrieve
      description: Unauthenticated marketplace browsing - only active stores are visible.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this store.
        required: true
      tags:
      - public-stores
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStoreDetail'
          description: ''
  /api/v1/public/stores/get-all/:
    post:
      operationId: public_stores_get_all_create
      description: Unauthenticated marketplace browsing - only active stores are visible.
      summary: List (filterable)
      tags:
      - public-stores
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
            examples:
              Example:
                value:
                  page: 1
                  pageSize: 20
                  filters:
                    name: Birid virid
                    created_at:
                      eq: '2026-09-21'
                      gt: '2026-01-01'
                      gte: '2026-01-01'
                      lt: '2026-12-31'
                      lte: '2026-12-31'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GetAllRequestRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicStore'
          description: ''
  /api/v1/stores/addresses/:
    post:
      operationId: stores_addresses_create
      description: |-
        CRUD scoped to the authenticated store admin's own store. `store` is never
        read from the request body/URL - only from the JWT-resolved account - so
        one store's admin can never read, edit, or delete another store's rows,
        and a foreign id 404s instead of leaking existence.
      tags:
      - stores-addresses
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StoreAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreAddressRequest'
        required: true
      security:
      - StoreAdminBearerAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreAddress'
          description: ''
