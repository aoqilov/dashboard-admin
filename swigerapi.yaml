components:
  schemas:
    BlankEnum:
      enum:
      - ''
    BuyerMe:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        login:
          type: string
          maxLength: 255
        active:
          type: boolean
        last_name:
          type: string
          maxLength: 150
        first_name:
          type: string
          maxLength: 150
        middle_name:
          type: string
          maxLength: 150
        age:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
        gender:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/GenderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        city:
          type: string
          maxLength: 150
        avatar_photo:
          type: string
          format: uri
          nullable: true
        avatar_photo_processed:
          type: string
          format: uri
          nullable: true
          readOnly: true
        avatar_processing_status:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/PhotoProcessingStatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - avatar_photo_processed
      - created_at
      - first_name
      - id
      - last_name
      - login
      - updated_at
    CancellationReasonEnum:
      enum:
