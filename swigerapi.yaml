      - buyer_unreachable
      - suspected_fraud
      - other
      type: string
      description: |-
        * `changed_mind` - Buyer changed their mind
        * `found_better_price` - Found a better price elsewhere
        * `ordered_by_mistake` - Ordered by mistake
        * `delivery_too_slow` - Delivery is taking too long
        * `out_of_stock` - Product out of stock
        * `cannot_fulfill` - Store cannot fulfill the order
        * `buyer_unreachable` - Could not reach the buyer
        * `suspected_fraud` - Suspected fraudulent order
        * `other` - Other
